<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
  <body style="margin:0;padding:24px;background:#F5F7FB;font-family:Arial,sans-serif;color:#17191F">
    <main style="max-width:480px;margin:auto;padding:24px;background:#FFFFFF;border:1px solid #E0E4ED;border-radius:12px">
      <h1 style="font-size:24px">Confirm your SiteQuote email</h1>
      <p>Enter this one-time code in the SiteQuote verification screen:</p>
      <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
      <p>This code expires after the period configured for email OTPs. If you did not request this, you can ignore the email.</p>
      <p style="font-size:13px;color:#687282">SiteQuote · Contractor CRM demo</p>
    </main>
  </body>
</html>
